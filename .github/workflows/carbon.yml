name: Carbon
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  offline-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist/carbon.html dist/THIRD-PARTY-LICENSES.txt src/carbon/templates.json src/carbon/castkit-assets.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carbon-browser-evidence
          path: test-results/
          if-no-files-found: ignore
